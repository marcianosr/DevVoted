# SonarQube Configuration for DevVoted
sonar.host.url=http://localhost:9001
sonar.projectKey=devvoted-tanstack
sonar.projectName=DevVoted - Developer Quiz Game
sonar.projectVersion=1.0.0

# Source and test directories
sonar.sources=./src
sonar.tests=./src

# Test file patterns
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

# Exclusions for analysis
sonar.exclusions=**/node_modules/**,\
  **/coverage/**,\
  **/.scannerwork/**,\
  src/routeTree.gen.ts,\
  src/test/setup.ts,\
  src/test/utils.tsx,\
  **/*.config.*,\
  **/*.d.ts

# Test exclusions 
sonar.test.exclusions=src/test/setup.ts,\
  src/test/utils.tsx,\
  src/test/createMockDataFactory.ts

# Coverage and test reports
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Language settings
sonar.sourceEncoding=UTF-8

# Quality gate settings
sonar.qualitygate.wait=false

# JavaScript/TypeScript specific settings
sonar.javascript.node.maxspace=4096