name: Release (Version Bump)

# Manually triggered. Turns the CHANGELOG.md [Unreleased] section into a dated,
# versioned release, bumps package.json, commits to main, then kicks off the
# production deploy (main.yaml) so the new version ships.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for unreleased changes
        id: check
        run: |
          npm run release --silent -- --dry-run 2>&1 | tee /tmp/release-dry.txt
          if grep -q "Nothing in \[Unreleased\]" /tmp/release-dry.txt; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and finalize changelog
        if: steps.check.outputs.skip == 'false'
        run: npm run release

      - name: Commit release
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./package.json').version")
          git add CHANGELOG.md package.json
          git commit -m "chore: release v${VERSION}"
          git push

      - name: Publish GitHub release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Extract this version's section from CHANGELOG.md into a file. Using a file
          # (not an inline --notes string) keeps changelog backticks from being run as
          # shell command substitution.
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver " " { collecting = 1; next }
            collecting && /^## / { exit }
            collecting { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "v${VERSION}" \
            --target main \
            --title "v${VERSION}" \
            --latest \
            --notes-file release-notes.md

      # A push authored by GITHUB_TOKEN does not trigger other workflows, so the
      # migration deploy is dispatched explicitly rather than relying on the push.
      - name: Trigger production deploy
        if: steps.check.outputs.skip == 'false'
        run: gh workflow run main.yaml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
