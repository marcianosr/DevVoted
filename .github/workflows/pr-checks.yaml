name: PR Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check changelog for unreleased entries
        id: check_changelog
        run: |
          npm run release --silent -- --dry-run --json > release.json
          cat release.json
          {
            echo "will_release=$(jq -r '.willRelease' release.json)"
            echo "new_version=$(jq -r '.newVersion // empty' release.json)"
            echo "bump_type=$(jq -r '.bumpType // empty' release.json)"
            echo "unreleased_content<<CHANGELOG_EOF"
            jq -r '.unreleased // empty' release.json
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: mshick/add-pr-comment@v3
        if: steps.check_changelog.outputs.will_release == 'true'
        with:
          message: |
            After merge, a **new version** of the game will be published.

            A **${{ steps.check_changelog.outputs.bump_type }}** bump → version **${{ steps.check_changelog.outputs.new_version }}**

            <details><summary>Unreleased changes</summary>

            ${{ steps.check_changelog.outputs.unreleased_content }}

            </details>

      - uses: mshick/add-pr-comment@v3
        if: steps.check_changelog.outputs.will_release == 'false'
        with:
          message: |
            After merge, **no new version** of the game will be published.

            The `[Unreleased]` section in `CHANGELOG.md` is empty.

  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      # Non-gating until DVTD-byvb clears the outstanding dependency findings.
      - name: Dead code check
        run: npm run lint:dead
        continue-on-error: true

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npx vite build
        env:
          NODE_ENV: production
