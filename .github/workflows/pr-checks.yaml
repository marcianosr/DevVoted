name: PR Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check changelog for unreleased entries
        id: check_changelog
        run: |
          OUTPUT=$(npm run release --silent -- --dry-run 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Nothing in \[Unreleased\]"; then
            echo "will_release=false" >> "$GITHUB_OUTPUT"
          else
            NEW_VERSION=$(echo "$OUTPUT" | grep "^New version" | awk '{print $NF}')
            BUMP_TYPE=$(echo "$OUTPUT" | grep "^Bump type" | awk '{print $4}')
            # Extract the [Unreleased] section: lines after its heading, up to the next release heading.
            # Match both "## [Unreleased]" and the bracketless "## Unreleased" the tool emits after a release.
            UNRELEASED=$(awk '/^## \[?Unreleased\]?/{started=1; next} started && /^## /{exit} started' CHANGELOG.md)
            echo "will_release=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"
            echo "unreleased_content<<CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
            echo "$UNRELEASED" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
          fi

      - uses: mshick/add-pr-comment@v3
        if: github.base_ref == 'main' && steps.check_changelog.outputs.will_release == 'true'
        with:
          message: |
            After merge, a **new version** of the game will be published.

            A **${{ steps.check_changelog.outputs.bump_type }}** bump → version **${{ steps.check_changelog.outputs.new_version }}**

            <details><summary>Unreleased changes</summary>

            ${{ steps.check_changelog.outputs.unreleased_content }}

            </details>

      - uses: mshick/add-pr-comment@v3
        if: github.base_ref == 'main' && steps.check_changelog.outputs.will_release == 'false'
        with:
          message: |
            After merge, **no new version** of the game will be published.

            The `[Unreleased]` section in `CHANGELOG.md` is empty.

  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --run
        env:
          NODE_ENV: test

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
